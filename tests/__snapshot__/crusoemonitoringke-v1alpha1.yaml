apiVersion: generators.external-secrets.io/v1alpha1
kind: CrusoeMonitoringKey
metadata: {}
spec:
  alias: string
  apiURL: string
  auth:
    accessKey:
      accessKeyIDSecretRef:
        key: string
        name: string
        namespace: string
      secretKeySecretRef:
        key: string
        name: string
        namespace: string
    serviceAccount:
      audience: string
      clientIDSecretRef:
        key: string
        name: string
        namespace: string
      clientSecretSecretRef:
        key: string
        name: string
        namespace: string
      tokenURL: string
  expiresAfter: "24h"
  projectID: string
