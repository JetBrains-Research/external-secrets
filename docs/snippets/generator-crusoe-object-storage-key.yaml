{% raw %}
apiVersion: generators.external-secrets.io/v1alpha1
kind: CrusoeObjectStorageKey
metadata:
  name: crusoe-object-storage
spec:
  organizationID: "ab4a6b00-aa5f-408e-a9fb-ac6de5eb45ab"
  alias: "external-secrets" # Optional
  expiresAfter: "24h" # Optional, defaults to 24h
  auth:
    accessKey:
      accessKeyIDSecretRef:
        name: crusoe-credentials
        key: access-key-id
      secretKeySecretRef:
        name: crusoe-credentials
        key: secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crusoe-object-storage
spec:
  refreshInterval: "12h" # Keep this below the generator's expiresAfter
  target:
    name: crusoe-object-storage
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: CrusoeObjectStorageKey
          name: crusoe-object-storage
{% endraw %}
