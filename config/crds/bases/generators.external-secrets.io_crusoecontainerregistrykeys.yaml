apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    external-secrets.io/component: controller
  name: crusoecontainerregistrykeys.generators.external-secrets.io
spec:
  group: generators.external-secrets.io
  names:
    categories:
    - external-secrets
    - external-secrets-generators
    kind: CrusoeContainerRegistryKey
    listKind: CrusoeContainerRegistryKeyList
    plural: crusoecontainerregistrykeys
    singular: crusoecontainerregistrykey
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CrusoeContainerRegistryKey generates a token for the Crusoe Container
          Registry.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CrusoeContainerRegistryKeySpec controls the behavior of the
              Crusoe Container Registry key generator.
            properties:
              alias:
                description: Alias is an optional human-readable name attached to
                  each generated token.
                type: string
              apiURL:
                description: |-
                  APIURL is the base URL of the Crusoe Cloud API, including the version path.
                  Defaults to https://api.cloud.crusoe.ai/v1.
                type: string
              auth:
                description: Auth configures how ESO authenticates with the Crusoe
                  Cloud API.
                maxProperties: 1
                minProperties: 1
                properties:
                  accessKey:
                    description: AccessKey authenticates with a Crusoe Cloud API access
                      key pair.
                    properties:
                      accessKeyIDSecretRef:
                        description: AccessKeyID references the secret key containing
                          the Crusoe Cloud API access key ID.
                        properties:
                          key:
                            description: |-
                              A key in the referenced Secret.
                              Some instances of this field may be defaulted, in others it may be required.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The name of the Secret resource being referred
                              to.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          namespace:
                            description: |-
                              The namespace of the Secret resource being referred to.
                              Ignored if referent is not cluster-scoped, otherwise defaults to the namespace of the referent.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        type: object
                      secretKeySecretRef:
                        description: SecretKey references the secret key containing
                          the Crusoe Cloud API secret key.
                        properties:
                          key:
                            description: |-
                              A key in the referenced Secret.
                              Some instances of this field may be defaulted, in others it may be required.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The name of the Secret resource being referred
                              to.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          namespace:
                            description: |-
                              The namespace of the Secret resource being referred to.
                              Ignored if referent is not cluster-scoped, otherwise defaults to the namespace of the referent.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        type: object
                    required:
                    - accessKeyIDSecretRef
                    - secretKeySecretRef
                    type: object
                  serviceAccount:
                    description: |-
                      ServiceAccount authenticates as a Crusoe Cloud service account (not a
                      Kubernetes ServiceAccount) using the OAuth2 client credentials grant.
                    properties:
                      audience:
                        description: |-
                          Audience is requested for the issued access token.
                          Defaults to https://api.crusoe.ai.
                        type: string
                      clientIDSecretRef:
                        description: ClientID references the secret key containing
                          the OAuth2 client ID of the service account credential.
                        properties:
                          key:
                            description: |-
                              A key in the referenced Secret.
                              Some instances of this field may be defaulted, in others it may be required.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The name of the Secret resource being referred
                              to.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          namespace:
                            description: |-
                              The namespace of the Secret resource being referred to.
                              Ignored if referent is not cluster-scoped, otherwise defaults to the namespace of the referent.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        type: object
                      clientSecretSecretRef:
                        description: ClientSecret references the secret key containing
                          the OAuth2 client secret of the service account credential.
                        properties:
                          key:
                            description: |-
                              A key in the referenced Secret.
                              Some instances of this field may be defaulted, in others it may be required.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: The name of the Secret resource being referred
                              to.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          namespace:
                            description: |-
                              The namespace of the Secret resource being referred to.
                              Ignored if referent is not cluster-scoped, otherwise defaults to the namespace of the referent.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        type: object
                      tokenURL:
                        description: |-
                          TokenURL is the OAuth2 token endpoint. It must use https.
                          Defaults to https://auth.crusoe.ai/oauth2/token.
                        type: string
                    required:
                    - clientIDSecretRef
                    - clientSecretSecretRef
                    type: object
                type: object
              expiresAfter:
                default: 24h
                description: |-
                  ExpiresAfter is the lifetime of each generated token. The Crusoe Cloud API
                  cannot revoke container registry tokens, so every token stays valid until
                  it expires. Keep this short and set the ExternalSecret refreshInterval below it.
                type: string
            required:
            - auth
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
